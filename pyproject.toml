[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagaudit"
version = "0.1.0"
description = "Check industrial tag data before you trust it: units, ranges, quality codes, timestamps, gaps and stuck values in OPC UA captures and historian CSV exports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Sankalp Thakur"}]
keywords = ["opc-ua", "historian", "scada", "data-quality", "iiot", "telemetry", "industrial", "time-series"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
# Standard library only, except the IANA time zone database, which Windows doesn't ship.
dependencies = ['tzdata; sys_platform == "win32"']

[project.optional-dependencies]
# The collector decodes OPC UA Read responses itself (see opcua.py), so it is
# pinned to the asyncua release whose wire helpers it was tested against.
opcua = ["asyncua==2.0.1"]
test = ["pytest>=8"]

[project.scripts]
tagaudit = "tagaudit.cli:main"

[project.urls]
Homepage = "https://github.com/sankalpsthakur/tagaudit"
Issues = "https://github.com/sankalpsthakur/tagaudit/issues"
Changelog = "https://github.com/sankalpsthakur/tagaudit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
