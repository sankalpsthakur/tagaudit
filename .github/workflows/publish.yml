name: publish

# Publishing a GitHub release builds, tests and uploads that exact commit to PyPI.
# PyPI trusts this workflow directly (trusted publishing). If the PYPI_API_TOKEN secret exists, the
# upload uses it instead.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - name: Test the built wheel
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tagaudit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the PYPI_API_TOKEN secret is not set, which keeps trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
